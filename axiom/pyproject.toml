[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "Axiom: a deterministic, turn-based tactical RPG core where algebraic manipulation is the combat mechanic."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["core", "tests", "cli_demo.py"]

[[tool.mypy.overrides]]
# Tests re-read engine properties after state-changing calls; mypy's literal
# narrowing of those properties produces false "unreachable" reports.
module = "tests.*"
warn_unreachable = false
disable_error_code = ["comparison-overlap"]
